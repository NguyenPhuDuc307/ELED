services:
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes:
      - ./releases/current:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      server:
        aliases: [eled-web]
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      FIREBASE_PROJECT_ID: eled-aaf5c
    networks:
      server:
        aliases: [eled-api]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3200/api/eled/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
    mem_limit: 256m
networks:
  server:
    external: true
    name: server_default
