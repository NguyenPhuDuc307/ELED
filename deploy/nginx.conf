server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    client_max_body_size 6m;
    location = /healthz { access_log off; return 200 'ok'; }
    location /api/eled/ { proxy_pass http://eled-api:3200; }
    location /api/ { return 404; }
    location = /index.html { add_header Cache-Control 'no-store'; }
    location = /vocabulary.json {
        default_type application/json;
        add_header Cache-Control 'public, max-age=3600, must-revalidate';
        try_files $uri =404;
    }
    location /assets/ { add_header Cache-Control 'public, max-age=31536000, immutable'; try_files $uri =404; }
    # Replace the retired Flutter service worker with an unregistering stub.
    location = /flutter_service_worker.js {
        default_type application/javascript;
        add_header Cache-Control 'no-store';
        return 200 'self.addEventListener("install",()=>self.skipWaiting());self.addEventListener("activate",e=>e.waitUntil(self.registration.unregister().then(()=>self.clients.matchAll()).then(cs=>cs.forEach(c=>c.navigate(c.url)))));';
    }
    location / { try_files $uri $uri/ /index.html; }
}
